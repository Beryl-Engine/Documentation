    parameters:
    - id: message
      type: System.ReadOnlySpan{System.Char}
      description: The message to log.
    - id: color
      type: System.ConsoleColor
      description: The color to set the console to.
    - id: writer
      type: System.IO.TextWriter
      description: The writer to write into.
    content.vb: Public Shared Sub StackLog(message As ReadOnlySpan(Of Char), color As ConsoleColor, writer As TextWriter)
