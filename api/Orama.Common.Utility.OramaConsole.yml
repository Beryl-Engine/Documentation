  summary: Low-Level method for logging a <xref href="System.ReadOnlySpan%601" data-throw-if-not-resolved="false"></xref> where <code>T</code> is <xref href="System.Char" data-throw-if-not-resolved="false"></xref> to the <xref href="Orama.Common.Utility.OramaConsole" data-throw-if-not-resolved="false"></xref> with no heap allocations.
  remarks: This method queues the given message to be logged by an async <xref href="System.Threading.Tasks.Task" data-throw-if-not-resolved="false"></xref>. As such, messages submitted via this method will be logged when possible rather than immediately, causing a possible desync.
