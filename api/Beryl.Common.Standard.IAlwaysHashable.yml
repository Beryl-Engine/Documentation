  summary: Defines a type that always has an implementation of <xref href="Beryl.Common.Standard.IAlwaysHashable.GetHashCode" data-throw-if-not-resolved="false"></xref> or <xref href="System.Object.GetHashCode" data-throw-if-not-resolved="false"></xref>.
  remarks: This interface is useful for implementing non-boxing hash functions. For instance, it is the only type constraint that can be used to get the hash code of a <code>ref struct</code> without throwing <xref href="System.Object" data-throw-if-not-resolved="false"></xref> boxing errors.
